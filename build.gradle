plugins {
    id 'application'
    id 'java'
    id 'org.graalvm.buildtools.native' version '0.10.2'
}

group = 'dev.groundwork'
def configuredVersion = (findProperty('groundworkVersion') ?: System.getenv('GROUNDWORK_VERSION') ?: '0.1.0-SNAPSHOT').toString()
version = configuredVersion.startsWith('v') ? configuredVersion.substring(1) : configuredVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'com.samskivert:jmustache:1.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'dev.groundwork.Groundwork'
}

processResources {
    filesMatching('groundwork-version.properties') {
        expand(version: project.version)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': 'Groundwork',
                'Implementation-Version': project.version
        )
    }
}

graalvmNative {
    binaries {
        main {
            imageName = 'groundwork'
            mainClass = 'dev.groundwork.Groundwork'
            buildArgs.add('--no-fallback')
            buildArgs.add('-H:IncludeResources=^(claude-templates/.*|defaults/.*|groundwork-version.properties|init/.*)$')
        }
    }
}
