name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-jvm-distributions:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROUNDWORK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JVM distributions
        run: ./gradlew clean distZip distTar installDist --no-daemon

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-jvm-distributions
          path: |
            build/distributions/*
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-jvm-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: groundwork-jvm-distributions
          path: release-assets

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            release-assets/*
