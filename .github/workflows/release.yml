name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build local CLI distribution
        run: ./gradlew installDist --no-daemon

      - name: Run end-to-end smoke test
        run: ./scripts/smoke-test.sh ./build/install/groundwork/bin/groundwork

  build-jvm-distributions:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROUNDWORK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JVM distributions
        run: ./gradlew clean distZip distTar installDist --no-daemon

      - name: Smoke test installed JVM CLI
        run: ./scripts/smoke-test.sh ./build/install/groundwork/bin/groundwork

      - name: Upload release assets
        uses: actions/upload-artifact@v5
        with:
          name: groundwork-jvm-distributions
          path: |
            build/distributions/*
          if-no-files-found: error

  build-native-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GROUNDWORK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: "25.0.2"
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native binary
        run: ./gradlew clean nativeCompile --no-daemon

      - name: Smoke test native CLI
        run: ./scripts/smoke-test.sh ./build/native/nativeCompile/groundwork

      - name: Package native binary
        run: |
          VERSION="${GROUNDWORK_VERSION#v}"
          PACKAGE_DIR="groundwork-${VERSION}-${{ matrix.target }}"
          mkdir -p "$PACKAGE_DIR"
          cp ./build/native/nativeCompile/groundwork "$PACKAGE_DIR"/groundwork
          cp LICENSE "$PACKAGE_DIR"/LICENSE
          tar -czf "${PACKAGE_DIR}.tar.gz" "$PACKAGE_DIR"

      - name: Upload native asset
        uses: actions/upload-artifact@v5
        with:
          name: groundwork-native-${{ matrix.target }}
          path: groundwork-*.tar.gz
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs:
      - build-jvm-distributions
      - build-native-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download JVM distribution assets
        uses: actions/download-artifact@v5
        with:
          name: groundwork-jvm-distributions
          path: release-assets

      - name: Download native assets
        uses: actions/download-artifact@v5
        with:
          pattern: groundwork-native-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 * > groundwork-sha256.txt

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            release-assets/*
